<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pixel Beta fingerprint</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --text:#17202a; --muted:#677382; --line:#e1e6ec;
  --accent:#1a73e8; --accent-text:#ffffff;
  --sel:rgba(46,160,67,.20); --selb:#2ea043; --ok:#2ea043; --err:#d93025;
  --shadow:0 1px 3px rgba(0,0,0,.08); --con-bg:#10151b; --con-text:#cfe3d4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1217; --card:#171d25; --text:#e7ebf0; --muted:#8b97a6; --line:#242c37;
    --accent:#6ea8fe; --accent-text:#0b1220;
    --sel:rgba(63,185,80,.22); --selb:#3fb950; --ok:#3fb950; --err:#ff7b72;
    --shadow:none; --con-bg:#0a0d11; --con-text:#cfe3d4;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top);
}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
header h1{flex:1;margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12.5px;color:var(--muted);font-weight:400;display:block;margin-top:2px}
.icon-btn{width:40px;height:40px;border:0;border-radius:12px;background:var(--card);color:var(--text);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:disabled{opacity:.45}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.status{margin:6px 12px 4px;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.status .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.status .cur{font-weight:600;margin-top:2px}
.status .fp{margin-top:4px;font:11.5px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all;user-select:text}
#demo{display:none;margin:6px 12px 0;padding:6px 10px;border-radius:10px;background:rgba(255,170,0,.18);font-size:12px}
.wrap{flex:1;min-height:0;position:relative}
#listWrap,#conWrap{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#list{padding:4px 0 12px}
.item{display:flex;align-items:center;gap:10px;margin:8px 12px;padding:13px 14px;border-radius:14px;
  background:var(--card);border:2px solid transparent;box-shadow:var(--shadow);cursor:pointer;
  transition:background .15s,border-color .15s}
.item .txt{flex:1;min-width:0}
.item .name{font-weight:600}
.item .code{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-top:1px}
.item .badge{display:none;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--muted)}
.item.cur .badge{display:inline-block}
.item .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 22px;position:relative}
.item.sel{background:var(--sel);border-color:var(--selb)}
.item.sel .tick{border-color:var(--selb);background:var(--selb)}
.item.sel .tick::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.msg{margin:28px 24px;text-align:center;color:var(--muted)}
.msg .big{font-size:15px;color:var(--text);margin-bottom:6px}
.msg button{margin-top:14px;padding:10px 18px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:600 14px system-ui;cursor:pointer}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
#con{margin:0;padding:12px 14px;min-height:100%;background:var(--con-bg);color:var(--con-text);
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;user-select:text}
footer{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.btn{height:50px;border:0;border-radius:14px;font:600 15px system-ui,sans-serif;cursor:pointer;
  transition:background .15s,opacity .15s}
#btnCon{flex:0 0 36%;background:transparent;border:2px solid var(--line);color:var(--text)}
#btnCon.on{border-color:var(--accent);color:var(--accent)}
#btnInst{flex:1;background:var(--accent);color:var(--accent-text)}
#btnInst.done{background:var(--ok);color:#fff}
#btnInst.err{background:var(--err);color:#fff}
#btnInst:disabled{opacity:.5;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  max-width:88%;padding:10px 16px;border-radius:12px;background:rgba(30,34,40,.94);color:#fff;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Pixel Beta отпечаток<span class="sub">Выберите устройство и нажмите «Установить»</span></h1>
  <button class="icon-btn" id="btnRef" title="Обновить список" aria-label="Обновить список">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>
<div id="demo">Демо-режим: страница открыта вне WebUI, команды эмулируются.</div>
<section class="status">
  <div class="lbl">Сейчас установлено</div>
  <div class="cur" id="cur">—</div>
  <div class="fp" id="fp"></div>
</section>
<div class="wrap">
  <div id="listWrap"><div id="list"></div></div>
  <div id="conWrap" hidden><pre id="con"></pre></div>
</div>
<footer>
  <button class="btn" id="btnCon">Консоль</button>
  <button class="btn" id="btnInst" disabled>Установить</button>
</footer>
<div id="toast"></div>
<script>
(function () {
  'use strict';

  var MOD = '/data/adb/modules/playintegrityfix';
  var SCRIPT = MOD + '/autopif4.sh';
  var LOG = '/data/local/tmp/pif_webui.log';
  var CONF = '/data/adb/autopif4_device.conf';

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- bridge to the WebUI host (KernelSU-compatible ksu.exec) ---------- */

  var demo = false;
  if (typeof window.ksu === 'undefined') { window.ksu = makeMock(); demo = true; $('demo').style.display = 'block'; }

  var cbCount = 0;
  function sh(cmd) {
    return new Promise(function (resolve, reject) {
      var name = 'pifcb_' + Date.now() + '_' + (cbCount++);
      window[name] = function (errno, stdout, stderr) {
        delete window[name];
        resolve({ errno: errno, stdout: stdout || '', stderr: stderr || '' });
      };
      try { window.ksu.exec(cmd, '{}', name); }
      catch (e) { delete window[name]; reject(e); }
    });
  }

  /* ---------- state ---------- */

  var st = {
    devices: [], selected: null, current: null, fp: '',
    state: 'idle',            /* idle | busy | done | error */
    loading: true, listError: '', consoleOpen: false
  };
  var listScroll = 0;

  /* ---------- helpers ---------- */

  function setLog(text) {
    var con = $('con');
    con.textContent = text;
    if (st.consoleOpen) { $('conWrap').scrollTop = $('conWrap').scrollHeight; }
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  function nameOf(code) {
    for (var i = 0; i < st.devices.length; i++) { if (st.devices[i].code === code) { return st.devices[i].model; } }
    return code;
  }

  /* run autopif4.sh in background, log -> LOG file, poll it until the exit marker shows up */
  function runJob(args, done) {
    var inner = '( unset ASH_STANDALONE; sh ' + SCRIPT + ' ' + args + ' ) > ' + LOG +
                ' 2>&1; echo __PIF_EXIT__=$? >> ' + LOG;
    var cmd = 'rm -f ' + LOG + '; : > ' + LOG + "; sh -c '" + inner + "' </dev/null >/dev/null 2>&1 &";
    var started = Date.now(), finished = false;

    function finish(rc, text) { if (!finished) { finished = true; done(rc, text); } }

    function tick() {
      if (finished) { return; }
      sh('cat ' + LOG).then(function (r) {
        var t = (r.stdout || '').replace(/\r/g, '');
        var m = t.match(/__PIF_EXIT__=(\d+)/);
        setLog('$ sh autopif4.sh ' + args + '\n' + t.replace(/__PIF_EXIT__=\d+\s*$/, ''));
        if (m) { finish(parseInt(m[1], 10), t); return; }
        if (Date.now() - started > 240000) { finish(124, t); return; }
        setTimeout(tick, 600);
      }, function (e) { setLog(String(e)); finish(126, ''); });
    }

    setLog('$ sh autopif4.sh ' + args + '\n');
    sh(cmd).then(function () { setTimeout(tick, 400); },
                 function (e) { setLog(String(e)); finish(125, ''); });
  }

  /* ---------- rendering ---------- */

  function renderStatus() {
    var cur = st.current ? (nameOf(st.current) + ' (' + st.current + ')') : '—';
    $('cur').textContent = cur;
    $('fp').textContent = st.fp || '';
  }

  function buildList() {
    var list = $('list');
    list.textContent = '';
    if (st.loading) {
      var l = document.createElement('div'); l.className = 'msg';
      l.innerHTML = '<div class="big"><span class="spin"></span>Загрузка списка устройств…</div>' +
                    '<div>Подробности — в «Консоли»</div>';
      list.appendChild(l); return;
    }
    if (st.listError) {
      var e = document.createElement('div'); e.className = 'msg';
      var big = document.createElement('div'); big.className = 'big'; big.textContent = st.listError;
      var b = document.createElement('button'); b.textContent = 'Повторить'; b.onclick = loadList;
      e.appendChild(big); e.appendChild(b); list.appendChild(e); return;
    }
    st.devices.forEach(function (d) {
      var it = document.createElement('div'); it.className = 'item'; it.setAttribute('data-code', d.code);
      var txt = document.createElement('div'); txt.className = 'txt';
      var n = document.createElement('div'); n.className = 'name'; n.textContent = d.model;
      var c = document.createElement('div'); c.className = 'code'; c.textContent = d.code + '_beta';
      txt.appendChild(n); txt.appendChild(c);
      var bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = 'Текущее';
      var tk = document.createElement('span'); tk.className = 'tick';
      it.appendChild(txt); it.appendChild(bd); it.appendChild(tk);
      it.onclick = function () { pick(d.code); };
      list.appendChild(it);
    });
    markItems();
  }

  function markItems() {
    var items = $('list').children;
    for (var i = 0; i < items.length; i++) {
      var code = items[i].getAttribute('data-code');
      if (!code) { continue; }
      items[i].classList.toggle('sel', code === st.selected);
      items[i].classList.toggle('cur', code === st.current);
    }
  }

  function renderButtons() {
    var bi = $('btnInst'), bc = $('btnCon');
    bi.className = 'btn';
    if (st.state === 'busy') {
      bi.innerHTML = '<span class="spin"></span>Установка…'; bi.disabled = true;
    } else if (st.state === 'done') {
      bi.textContent = 'Установлено ✓'; bi.classList.add('done'); bi.disabled = true;
    } else if (st.state === 'error') {
      bi.textContent = 'Ошибка — повторить'; bi.classList.add('err'); bi.disabled = false;
    } else {
      bi.textContent = 'Установить'; bi.disabled = !st.selected || st.loading;
    }
    bc.classList.toggle('on', st.consoleOpen);
    $('btnRef').disabled = (st.state === 'busy' || st.loading);
  }

  function renderView() {
    var lw = $('listWrap'), cw = $('conWrap');
    if (st.consoleOpen) {
      listScroll = lw.scrollTop;
      lw.hidden = true; cw.hidden = false;
      cw.scrollTop = cw.scrollHeight;
    } else {
      cw.hidden = true; lw.hidden = false;
      lw.scrollTop = listScroll;
    }
  }

  /* ---------- actions ---------- */

  function pick(code) {
    if (st.state === 'busy' || st.loading) { return; }
    st.selected = code;
    if (st.state === 'done' || st.state === 'error') { st.state = 'idle'; }
    markItems(); renderButtons();
  }

  function install() {
    if (!st.selected || st.state === 'busy' || st.loading) { return; }
    var code = st.selected;
    if (!/^[a-z0-9]+$/.test(code)) { return; }
    st.state = 'busy'; renderButtons();
    runJob('-d ' + code, function (rc) {
      if (rc === 0) {
        st.state = 'done'; st.current = code;
        toast('Установлено: ' + nameOf(code));
        refreshStatus();
      } else {
        st.state = 'error';
        toast('Ошибка установки (код ' + rc + '). Откройте «Консоль»');
      }
      markItems(); renderStatus(); renderButtons();
    });
  }

  function parseList(text) {
    var out = [], re = /^PIFLIST\|([a-z0-9]+)\|(.*)$/gm, m;
    while ((m = re.exec(text)) !== null) { out.push({ code: m[1], model: m[2].replace(/\s+$/, '') }); }
    return out;
  }

  function loadList() {
    if (st.state === 'busy') { return; }
    st.loading = true; st.listError = ''; st.selected = null; st.state = 'idle';
    buildList(); renderButtons();
    var check = 'grep -q LIST_ONLY ' + SCRIPT + ' && grep -q SAVE_PIN ' + SCRIPT + ' && echo PIF_OK';
    sh(check).then(function (r) {
      if (r.stdout.indexOf('PIF_OK') < 0) {
        st.loading = false;
        st.listError = 'autopif4.sh не пропатчен (нет опций -L / -d)';
        buildList(); renderButtons(); return;
      }
      runJob('-L', function (rc, text) {
        var devs = parseList(text);
        st.loading = false;
        if (!devs.length) {
          st.listError = (rc === 0 ? 'Список устройств пуст' : 'Не удалось получить список (код ' + rc + ')');
        } else { st.devices = devs; }
        buildList(); renderStatus(); renderButtons();
      });
    }, function (e) {
      st.loading = false; st.listError = 'Нет доступа к root-оболочке: ' + e;
      buildList(); renderButtons();
    });
  }

  function refreshStatus() {
    var cmd = 'cat ' + CONF + ' 2>/dev/null | head -n1; echo "|"; ' +
              "grep -h '^FINGERPRINT=' " + MOD + '/custom.pif.prop ' + MOD + '/pif.prop 2>/dev/null | head -n1';
    sh(cmd).then(function (r) {
      var parts = r.stdout.replace(/\r/g, '').split('|');
      var code = (parts[0] || '').replace(/\s+/g, '');
      var fp = (parts[1] || '').replace(/^\s*FINGERPRINT=/, '').replace(/\s+$/, '');
      st.current = code || st.current; st.fp = fp;
      markItems(); renderStatus();
    }, function () {});
  }

  /* ---------- wiring ---------- */

  $('btnInst').onclick = install;
  $('btnRef').onclick = loadList;
  $('btnCon').onclick = function () {
    st.consoleOpen = !st.consoleOpen;
    renderView(); renderButtons();
  };

  buildList(); renderButtons(); renderStatus(); renderView();
  refreshStatus();
  loadList();

  /* ---------- demo / preview backend (only used when ksu is missing) ---------- */

  function makeMock() {
    var log = '', cur = 'bluejay', fp = 'google/bluejay_beta/bluejay:CANARY/DEMO.000000.000/0000000:user/release-keys';
    var devs = [['bluejay','Pixel 6a'],['panther','Pixel 7'],['cheetah','Pixel 7 Pro'],['lynx','Pixel 7a'],
      ['tangorpro','Pixel Tablet'],['felix','Pixel Fold'],['shiba','Pixel 8'],['husky','Pixel 8 Pro'],
      ['akita','Pixel 8a'],['tokay','Pixel 9'],['caiman','Pixel 9 Pro'],['komodo','Pixel 9 Pro XL'],
      ['comet','Pixel 9 Pro Fold'],['tegu','Pixel 9a'],['frankel','Pixel 10'],['blazer','Pixel 10 Pro']];
    function add(ms, line) { setTimeout(function () { log += line + '\n'; }, ms); }
    return {
      exec: function (cmd, opts, name) {
        var out = '';
        if (cmd.indexOf('grep -q LIST_ONLY') === 0) { out = 'PIF_OK\n'; }
        else if (cmd.indexOf('cat ' + LOG) === 0) { out = log; }
        else if (cmd.indexOf('cat ' + CONF) === 0) { out = cur + '\n|\nFINGERPRINT=' + fp + '\n'; }
        else if (cmd.indexOf("sh -c '") >= 0) {
          log = '';
          var m = cmd.match(/autopif4\.sh (-\S+)(?: (\w+))?/);
          if (m && m[1] === '-L') {
            add(200, '- Crawling Android Developers for latest Pixel Beta device list ...');
            add(900, String(devs.length));
            devs.forEach(function (d) { add(1000, 'PIFLIST|' + d[0] + '|' + d[1]); });
            add(1100, '__PIF_EXIT__=0');
          } else if (m && m[1] === '-d') {
            var c = m[2];
            add(200, '- Selecting Pixel Beta device ...');
            add(700, 'Saved device selection to /data/adb/autopif4_device.conf');
            add(1200, '- Crawling Android Flash Tool for latest Pixel Canary build info ...');
            add(2000, 'Android 17');
            add(2600, '- Dumping values to minimal pif.prop ...');
            add(3000, 'DEVICE=' + c);
            add(3300, '- Installing new prop ...');
            setTimeout(function () { cur = c; fp = 'google/' + c + '_beta/' + c + ':CANARY/DEMO.000000.000/0000000:user/release-keys'; }, 3300);
            add(3500, '__PIF_EXIT__=0');
          }
        }
        setTimeout(function () { window[name](0, out, ''); }, 30);
      }
    };
  }
})();
</script>
</body>
</html>
